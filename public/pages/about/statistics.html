<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SPARK impact statistics — students taught, hours contributed, schools served, and community ratings.">
    <title>SPARK - Statistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script>
        document.head.appendChild(Object.assign(document.createElement('base'), {
            href: "/"
        }));
    </script>
    <script src="src/index.js"></script>
    <script src="src/UI.js"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/statistics.css">
</head>
<body>

    <navbar-component></navbar-component>

    <main class="container">

        <header class="page-header statistics-header">
            <nav class="about-subnav" id="about-nav" aria-label="About pages"></nav>
            <h1 class="title">Our (Total) Service Statistics</h1>
            <div class="page-header-row">
                <p class="description">SPARK is dedicated to providing STEM education to all children, regardless of their background. Here are some of our key statistics:</p>
                <button type="button" onclick="alert('coming soon!')">Seasonal Statistics</button>
            </div>
        </header>

        <div class="statistics"></div>
    </main>

    <footer-component></footer-component>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await UI.loadScripts(["stats.js", "about.js"], "src/data/");
            await UI.loadComponents([
                "dropdown/dropdown.js",
                "about/about-nav.js",
                "statistic/statistic.js",
                "statistic/statistics.js"
            ], "src/components/");

            UI.add(document.getElementById("about-nav"), renderAboutNav("statistics"));

            document.querySelector(".statistics").replaceWith(renderStatistics());

            const duration = 1200;
            const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

            function animate(el, end, format) {
                let start = null;
                const step = ts => {
                    if (!start) start = ts;
                    let progress = Math.min((ts - start) / duration, 1);
                    let eased = easeOutCubic(progress);
                    let value = end * eased;

                    if (format === "$") el.textContent = "$" + Math.floor(value).toLocaleString();
                    else if (format === "decimal") el.textContent = value.toFixed(1);
                    else el.textContent = Math.floor(value);

                    if (progress < 1) requestAnimationFrame(step);
                    else el.textContent = format === "$" ? "$" + end.toLocaleString() : (format === "decimal" ? end.toFixed(1) : end);
                };
                requestAnimationFrame(step);
            }

            function parse(el) {
                let txt = el.textContent.trim();
                if (txt.startsWith("$")) return { end: +txt.replace(/\D/g, ""), format: "$" };
                if (txt.includes(".")) return { end: parseFloat(txt), format: "decimal" };
                if (txt.includes("+")) return { end: parseInt(txt, 10), format: "number" };
                return { end: parseInt(txt, 10), format: "number" };
            }

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !entry.target.dataset.animated) {
                        let { end, format } = parse(entry.target);
                        animate(entry.target, end, format);
                        entry.target.dataset.animated = "true";
                    }
                });
            }, { threshold: 0.3 });

            document.querySelectorAll(".statistic .title").forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
