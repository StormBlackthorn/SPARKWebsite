<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore SPARK chapters at local elementary schools in the Northshore School District.">
    <title>SPARK - Chapters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script>
        document.head.appendChild(Object.assign(document.createElement('base'), {
            href: "/"
        }));
    </script>
    <script src="src/index.js"></script>
    <script src="src/UI.js"></script>
    <script src="src/search.js"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/chapters.css">
</head>

<body>
    <navbar-component></navbar-component>

    <main class="container chapters-page">
        <header class="page-header">
            <h1 class="title">Our Chapters</h1>
            <p class="description">These are the local schools we teach at.</p>
        </header>

        <div class="search">
            <input type="search" id="searchInput" placeholder="Search for a chapter..." aria-label="Search chapters">
            <div class="filter">
                <img src="styles/assets/icons/filter.png" alt="" id="filterIcon" role="button" tabindex="0" aria-label="Filter by location">

                <div class="tooltip" role="dialog" aria-label="Filter options">
                    <h2>Filter by Location</h2>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="directory-table" aria-label="SPARK chapter directory">
                <thead>
                    <tr>
                        <th scope="col">School</th>
                        <th scope="col">Country</th>
                        <th scope="col">State/Region</th>
                    </tr>
                </thead>
            </table>
        </div>
    </main>

    <footer-component></footer-component>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await UI.loadComponents([
                "chapter/school.js",
                "chapter/location-filter.js",
                "chapter/chapters.js"
            ], "src/components/");

            UI.add(document.querySelector(".directory-table"), renderChapters());
            UI.add(document.querySelector(".tooltip"), renderLocationFilters(), 1);
            document.getElementById("searchInput")?.dispatchEvent(new Event("input"));
        });
    </script>

</body>
</html>
