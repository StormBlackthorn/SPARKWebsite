<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Volunteer with SPARK — teach STEM at local elementary schools or chaperone a club.">
    <title>SPARK - Volunteer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script>
        document.head.appendChild(Object.assign(document.createElement('base'), {
            href: "/"
        }));
    </script>
    <script src="src/index.js"></script>
    <script src="src/UI.js"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/volunteer.css">
</head>

<body>
    <navbar-component></navbar-component>

    <main class="container volunteer-page">

        <section class="volunteer-hero" aria-label="Volunteer overview">
            <div class="volunteer-hero-content">
                <p class="hero-kicker">Get involved</p>
                <h1 class="page-title">Volunteer</h1>
                <p class="page-lead">High school students teach afterschool STEM clubs. Parents chaperone in the
                    classroom.</p>
                <div class="hero-actions">
                    <a href="pages/contactUs.html"><button type="button">Get started</button></a>
                    <a href="pages/about/chapters.html"><button type="button" class="btn-secondary">Browse
                            chapters</button></a>
                </div>
            </div>
            <div class="volunteer-hero-media">
                <img src="styles/assets/classroom_images/3.png" alt="SPARK volunteer teaching a small group of students">
            </div>
        </section>

        <section class="tabs-container" id="volunteer-paths" aria-label="Volunteer paths"></section>

    </main>

    <footer-component></footer-component>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await UI.loadComponents([
                "volunteer/volunteer-tab.js",
                "volunteer/volunteer-panel.js",
                "volunteer/volunteer-paths.js"
            ], "src/components/");

            const container = document.getElementById("volunteer-paths");
            UI.add(container, renderVolunteerPaths());
            initVolunteerTabs(container);
        });
    </script>
</body>
</html>
